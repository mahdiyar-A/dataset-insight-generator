name: CI

# Runs on every push and pull request. This is the gate: nothing merges to a
# protected branch unless the full test suite passes.
#
# Deliberately no deploy stage. Provisioning AWS and Supabase is manual for this
# project — a deploy job here would either sit broken or need long-lived cloud
# credentials in repo secrets. Build artifacts are produced and uploaded so a
# manual deploy can pull a known-good build rather than rebuilding by hand.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs on the same branch — no point testing a commit that
# has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  # Node 24 matches the version the lockfile was generated under. Node 20 lacks
  # webidl.util.markAsUncloneable, which the locked undici/jsdom pair calls —
  # vitest crashed on startup with 4 unhandled errors and zero tests run.
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ── Backend: C# / ASP.NET Core ─────────────────────────────────────────────
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore dataset-insight-generator.sln

      # Warnings-as-errors is deliberately NOT set here. The goal of this gate is
      # to catch behavioural regressions, not to block on style drift.
      - name: Build
        run: dotnet build dataset-insight-generator.sln --no-restore --configuration Release

      # The test suite replaces Supabase, Stripe, SMTP and the Python service
      # with in-memory fakes, so no secrets or running services are needed.
      - name: Test
        run: >
          dotnet test backend.Tests/backend.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults
          retention-days: 14

  # ── AI service: Python / FastAPI ───────────────────────────────────────────
  ai-service:
    name: AI service — test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        working-directory: ai_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # These tests cover the data-cleaning convergence invariant:
      #   check_data_quality(clean_dataset(df)).needsCleaning == False
      # They make no network calls and need no API keys.
      - name: Run tests
        working-directory: ai_service
        run: python -m pytest tests/ -v --junitxml=../ai-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: ai-test-results.xml
          retention-days: 14

  # ── Frontend: Next.js ──────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Unit tests over the pure logic: the annotation tree, the error-message
      # helper, and the request shapes BackendAPI builds. No network, no server.
      - name: Test
        working-directory: frontend
        run: npm test

      # `next build` type-checks the whole app. A type error that only surfaces
      # at build time would otherwise reach production — the dev server is more
      # forgiving than the production compiler.
      #
      # Placeholder env values: the build only needs these to exist. No real
      # keys are required because nothing is fetched at build time.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5150
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  # ── Docker images build cleanly ────────────────────────────────────────────
  # Catches Dockerfile drift — a missing COPY or a dependency that installs
  # locally but not in the container image. Images are built, not pushed.
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, ai-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Context is ./backend, matching docker-compose.yml — the Dockerfile copies
      # backend.csproj from the context root, so building from the repo root fails.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai_service
          file: ai_service/Dockerfile
          push: false
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Summary gate ───────────────────────────────────────────────────────────
  # Single required check to protect a branch with, instead of listing every
  # job individually in branch protection settings.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, ai-service, frontend, docker]
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
